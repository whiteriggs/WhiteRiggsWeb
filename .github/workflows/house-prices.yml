name: Precios de vivienda

# El ministerio publica un trimestre nuevo cada tres meses, pero sin fecha fija:
# se mira cada mes y solo se hace commit si de verdad cambió algo.
on:
  schedule:
    - cron: "17 5 3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install xlrd

      # Aborta si el origen cambia de formato, en vez de publicar datos malos.
      - run: python3 scripts/build_house_prices.py

      - name: Publicar si hay trimestre nuevo
        run: |
          if [ -z "$(git status --porcelain data/lyvara)" ]; then
            echo "Sin cambios: el ministerio sigue en el mismo trimestre."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lyvara
          git commit -m "Precios de vivienda: nuevo trimestre del Ministerio"
          git push

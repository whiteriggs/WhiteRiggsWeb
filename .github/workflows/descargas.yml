name: Descargas

# Apple publica normalmente a las 08:00 PT (15:00/16:00 UTC).
# El margen evita consultar el diario antes de que este disponible.
on:
  schedule:
    - cron: "40 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: descargas
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install cryptography

      # La clave privada solo existe durante el job y nunca sale del runner.
      - name: Comprobar el acumulado
        run: python3 -m unittest discover -s tests -p 'test_descargas.py'

      - name: Leer las descargas totales
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER }}
          ASC_VENDOR: ${{ secrets.ASC_VENDOR }}
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/clave.p8"
          trap 'rm -f "$RUNNER_TEMP/clave.p8"' EXIT
          ASC_KEY="$RUNNER_TEMP/clave.p8" python3 scripts/descargas.py total --json data/descargas.json

      - name: Conservar historico y publicar el total
        run: |
          git add data/descargas.json data/descargas-historico.json
          git diff --cached --quiet && {
            echo "Sin cambios en el historico."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Descargas al dia"
          git push
